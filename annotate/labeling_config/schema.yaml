# Schema for raja_fashion labels.
# Every object has: cls, region (for attribute-specific boxes), box [xc, yc, w, h] (normalized 0-1), attrs {}

classes:
  - top
  - bottom

attributes:
  top:
    length:
      - regular
      - cropped
    button:
      - none          # No-button
      - half          # Half-button
      - down          # Button-down
    neck:
      - crew
      - v
      - polo
      - square
      - off_shoulder
    pattern:
      - dot
      - check
      - stripe
      - corner_only
      - graphic
      - plain
    sleeve:
      - short
      - long
      - camis
      - sleeveless

  bottom:
    length:
      - long
      - short
    pattern:
      - graphic
      - stripe
      - check
      - plain
    fit:
      - skinny
      - straight
      - baggy

# Regions used by the label tool (one box per region/attribute)
# Sleeves are explicitly left/right so the model can learn side.
regions:
  top:
    - length
    - button
    - neck
    - pattern
    - sleeve_left
    - sleeve_right
  bottom:
    - length
    - pattern
    - fit
