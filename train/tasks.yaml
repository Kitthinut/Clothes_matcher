# Progressive tasks. Start with one attribute, then expand.
# mode: "detect" = YOLO detection (one class per attribute value)
#        "cls"    = classification on cropped boxes (good for attributes)

# ---- Phase 1: test single attributes first ----
neck_crew:
  mode: detect
  object: top
  attribute: neck
  classes:
    crew: [crew]
    not_crew: [v, polo, square, off_shoulder]
  else: not_crew
  model: yolo11n.pt          # or yolo26n.pt when available
  imgsz: 640

top_length:
  mode: detect
  object: top
  attribute: length
  classes:
    regular: [regular]
    cropped: [cropped]
  model: yolo11n.pt
  imgsz: 640

bottom_fit:
  mode: detect
  object: bottom
  attribute: fit
  classes:
    skinny: [skinny]
    straight: [straight]
    baggy: [baggy]
  model: yolo11n.pt
  imgsz: 640

# ---- Full multi-class detection ----
tops_full:
  mode: detect
  objects: [top]
  # class names become the combination of attributes or just "top"
  # For simplicity we keep a single "top" class and rely on attributes later
  model: yolo11n.pt
  imgsz: 640

bottoms_full:
  mode: detect
  objects: [bottom]
  model: yolo11n.pt
  imgsz: 640

# ---- Classification tasks (crop the region, classify attribute) ----
neck_cls:
  mode: cls
  object: top
  attribute: neck
  classes:
    crew: [crew]
    v: [v]
    polo: [polo]
    square: [square]
    off_shoulder: [off_shoulder]
  model: yolo11n-cls.pt
  imgsz: 224

sleeve_cls:
  mode: cls
  object: top
  attribute: sleeve
  classes:
    short: [short]
    long: [long]
    camis: [camis]
    sleeveless: [sleeveless]
  model: yolo11n-cls.pt
  imgsz: 224
