# Progressive tasks matched to what you currently have labeled.
# mode: "detect" = YOLO detection (box + class)
#        "cls"    = classification on cropped boxes

# ── What you can train NOW (enough data) ──────────────────────────

# Top neck: only crew + polo are labeled so far
neck_type:
  mode: detect
  object: top
  attribute: neck
  classes:
    crew: [crew]
    polo: [polo]
  model: yolo11n.pt
  imgsz: 640
  rect: true

# Top sleeve length: short + long only (camis / sleeveless = 0)
sleeve_length:
  mode: detect
  object: top
  attribute: sleeve
  classes:
    short: [short]
    long: [long]
  model: yolo11n.pt
  imgsz: 640
  rect: true

# Bottom length
bottom_length:
  mode: detect
  object: bottom
  attribute: length
  classes:
    long: [long]
    short: [short]
  model: yolo11n.pt
  imgsz: 640
  rect: true

# Bottom fit: only skinny + baggy labeled (straight = 0)
bottom_fit:
  mode: detect
  object: bottom
  attribute: fit
  classes:
    skinny: [skinny]
    baggy: [baggy]
  model: yolo11n.pt
  imgsz: 640
  rect: true

# ── Legacy / future (need more labels first) ──────────────────────

# Binary crew vs everything else (optional)
neck_crew:
  mode: detect
  object: top
  attribute: neck
  classes:
    crew: [crew]
    not_crew: [v, polo, square, off_shoulder]
  else: not_crew
  model: yolo11n.pt
  imgsz: 640
  rect: true

# Needs top length boxes first (you currently have 0)
top_length:
  mode: detect
  object: top
  attribute: length
  classes:
    regular: [regular]
    cropped: [cropped]
  model: yolo11n.pt
  imgsz: 640
  rect: true
